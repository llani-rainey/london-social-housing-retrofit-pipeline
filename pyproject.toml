[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: tests that require a running Spark session (Java 17+)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: line length handled by ruff format; I001: PySpark aliased imports (round as spark_round)
# split into separate blocks by ruff isort — accepted pattern in PySpark codebases
ignore = ["E501", "I001"]
